# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#enable-auto-merge-on-a-pull-request
name: Dependabot Auto-merge

on:
  pull_request:

# Use my GitHub app’s token instead of `GITHUB_TOKEN` for merging.
permissions: {}

jobs:
  # Tell whether the update changes the built extension, which then needs rebuilding (and releasing once it’s on the
  # store) after merging. Kept in a job of its own, without any secret or write permission, because `npm ci` and
  # `npm run build` run the updated packages’ code.
  build-diff:
    runs-on: ubuntu-latest
    # Skip a run triggered by someone else pushing to Dependabot’s branch: it can’t read Dependabot’s secrets, and a pull
    # request changed by hand shouldn’t be merged automatically anyway. `dependabot-auto-merge` is skipped along with
    # this job.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      # Without `ref`, this checks out the merge commit of the base and the pull request, so comparing it with the base
      # shows only the pull request’s changes even if the base has moved on since Dependabot created the branch.
      - uses: actions/checkout@v7.0.1
        with:
          path: head
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: head/.node-version
          cache: npm
          cache-dependency-path: |
            base/package-lock.json
            head/package-lock.json
      - name: Build the base
        working-directory: base
        run: |
          npm ci
          npm run build
      - name: Build the pull request
        working-directory: head
        run: |
          npm ci
          npm run build

      # The build is deterministic, so any difference comes from the update. `diff` also fails when it can’t compare,
      # which is treated as a change to be on the safe side.
      - name: Compare the builds
        id: compare
        run: |
          if diff -rq base/dist head/dist; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
    timeout-minutes: 10

  dependabot-auto-merge:
    runs-on: ubuntu-latest
    needs: build-diff
    permissions:
      # For `dependabot/fetch-metadata` to read the pull request’s commits.
      pull-requests: read
    steps:
      # https://github.com/dependabot/fetch-metadata
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      # https://github.com/actions/create-github-app-token
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3.4.0
        with:
          client-id: ${{ secrets.KG8M_BOT_CLIENT_ID }}
          private-key: ${{ secrets.KG8M_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Leave an update changing the build unmerged, so it’s noticed and merged when there’s time to rebuild the
      # extension. Skip commenting again when the pull request is updated later.
      - name: Comment that the update changes the build
        if: needs.build-diff.outputs.changed == 'true'
        run: |
          if gh pr view "$PR_URL" --json comments --jq '.comments[].body' | grep -qF "$MARKER"; then
            exit 0
          fi
          gh pr comment "$PR_URL" --body "$MARKER
          This update changes the built extension, so it’s left for manual merging. After merging it, rebuild the extension (and release it once it’s on the store)."
        env:
          PR_URL: "${{ github.event.pull_request.html_url }}"
          MARKER: "<!-- build-output-changed -->"
          GH_TOKEN: "${{ steps.generate_token.outputs.token }}"

      # Also leave major updates for manual review: UI isn’t covered by tests, so an update passing CI can still break
      # the extension at runtime, and major updates are the likeliest to.
      - name: Enable auto-merge for Dependabot PRs
        if: >-
          needs.build-diff.outputs.changed == 'false' &&
          steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: "${{ github.event.pull_request.html_url }}"

          # Use my GitHub app’s temporary token because the default `GITHUB_TOKEN` prevents other workflows from being
          # triggered on a pull request creation.
          # cf. https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow
          GH_TOKEN: "${{ steps.generate_token.outputs.token }}"
    timeout-minutes: 5
